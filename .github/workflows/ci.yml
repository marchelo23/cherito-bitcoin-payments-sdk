name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10
        
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Check formatting & linting
      run: pnpm run lint
      
    - name: Build and Typecheck
      run: |
        pnpm run build
        pnpm run typecheck
        
    - name: Run Tests
      run: pnpm test

  regtest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run regtest full suite (temporary verification)
      run: pnpm run test:e2e

    - name: Sanitize collected logs
      if: failure()
      run: |
        if [ -d e2e/.tmp/logs ]; then
          find e2e/.tmp/logs -type f -exec sed -i -E \
            -e 's/sk_(live|test)_[A-Za-z0-9_-]+/sk_REDACTED/g' \
            -e 's/cs_[A-Za-z0-9_-]+/cs_REDACTED/g' \
            -e 's/whsec_[A-Za-z0-9_-]+/whsec_REDACTED/g' \
            -e 's/[0-9a-f]{120,}/MACAROON_REDACTED/g' {} +
        fi

    - name: Upload regtest logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: regtest-smoke-logs-${{ github.run_id }}
        path: e2e/.tmp/logs
        retention-days: 7
        if-no-files-found: ignore

    - name: Tear down regtest environment
      if: always()
      run: |
        pnpm run regtest:down || true
        docker system prune -af --volumes || true
