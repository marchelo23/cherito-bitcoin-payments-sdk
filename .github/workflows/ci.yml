name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10
        
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Check formatting & linting
      run: pnpm run lint
      
    - name: Build and Typecheck
      run: |
        pnpm run build
        pnpm run typecheck
        
    - name: Run Tests
      run: pnpm test

  regtest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run regtest smoke suite
      run: pnpm run test:e2e:smoke

    - name: Tear down regtest environment
      if: always()
      run: |
        pnpm run regtest:down || true
        docker system prune -af --volumes || true
